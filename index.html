/* ---------------------------- scoring ---------------------------- */

function scoreRound(q, subs, board){
  const sorted = [...board].sort((a,b)=>b.score-a.score);
  const leaderId = sorted[0]?.id ?? null;
  const bottom = new Set(sorted.slice(Math.ceil(sorted.length/2)).map(t=>t.id));
  const correct = subs.filter(s=>s.choice===q.a).sort((a,b)=>a.ts-b.ts);
  const leaderWrong = leaderId != null && !correct.some(s=>s.id===leaderId);

  return subs.map(s=>{
    const ok = s.choice === q.a;
    const w = (q.t==="wager"||q.t==="final") ? (s.wager||1) : 1;
    let delta = 0;
    if (ok) delta = q.p * w;
    else if (q.t==="negative") delta = -100;
    else if (q.t==="wager"||q.t==="final") delta = -Math.round(q.p*0.5*w);

    if (ok && q.t==="speed" && correct[0]?.id===s.id) delta *= 2;
    if (ok && q.t==="lonewolf" && correct.length===1) delta *= 3;
    if (ok && q.t==="underdog" && bottom.has(s.id)) delta *= 2;
    if (ok && q.t==="bounty" && leaderWrong && s.id!==leaderId) delta += 150;
    return { id:s.id, ok, delta };
  });
}

const boardHTML = (board, results, meId) => {
  const rows = [...board].sort((a,b)=>b.score-a.score);
  if (!rows.length) return `<p class="note">No teams yet.</p>`;
  const dmap = Object.fromEntries((results||[]).map(r=>[r.id,r.delta]));
  return rows.map((t,i)=>{
    const d = dmap[t.id];
    const cls = [i===0?"lead":"", d>0?"up":d<0?"dn":"", t.id===meId?"me":""].join(" ");
    return `<div class="row ${cls}"><span class="rank">${i+1}</span><span class="nm">${esc(t.name)}</span>
      ${d!==undefined&&d!==0?`<span class="dl">${d>0?"+"+d:d}</span>`:""}
      <span class="sc">${t.score}</span></div>`;
  }).join("");
};

}, 150);

    render();
  });
  onValue(ref(db, `${P(S.code)}/answers`), snap => { S.answers = snap.val() || {}; render(); });
  S.state = { phase:"lobby", qi:0, endsAt:null };
  render();
}
const pushState = (s) => { S.state = s; set(ref(db, `${P(S.code)}/state`), s); render(); };

const openQuestion = (qi) => pushState({ phase:"question", qi, endsAt: Date.now() + SECONDS*1000 });

function hostStart(){
  if (showsCard(0)) pushState({ phase:"twist", qi:0, endsAt:null });
  else openQuestion(0);
}

async function hostReveal(){
  const qi = S.state.qi, q = QUESTIONS[qi];
  const snap = await get(ref(db, `${P(S.code)}/answers/${qi}`));
  const raw = snap.val() || {};
  const subs = Object.entries(raw).filter(([,v])=>v.choice!=null)
    .map(([id,v])=>({ id, choice:v.choice, ts:v.ts||0, wager:v.wager||1 }));
  const results = scoreRound(q, subs, S.board);

  let next = S.board.map(t=>{
    const r = results.find(x=>x.id===t.id);
    return r ? { ...t, score: t.score + r.delta } : t;
  });
  if (q.t === "swap" && next.length > 1){
    const s = [...next].sort((a,b)=>b.score-a.score);
    const [a,b] = [s[0], s[1]];
    next = next.map(t => t.id===a.id ? {...t, score:b.score} : t.id===b.id ? {...t, score:a.score} : t);
  }
  const upd = {};
  next.forEach(t => { upd[`${P(S.code)}/board/${t.id}/score`] = t.score; });
  await update(ref(db), upd);
  pushState({ phase:"reveal", qi, endsAt:null, results });
}

function hostNext(){
  const n = S.state.qi + 1;
  if (n >= QUESTIONS.length) return pushState({ phase:"final", qi:S.state.qi, endsAt:null, results:S.state.results });
  if (showsCard(n)) pushState({ phase:"twist", qi:n, endsAt:null });
  else openQuestion(n);
}

setInterval(()=>{
  if (S.mode !== "host" || S.state?.phase !== "question") return;
  const answered = Object.values(S.answers[S.state.qi] || {}).filter(a=>a.choice!=null).length;
  if (Date.now() > S.state.endsAt || (S.board.length && answered >= S.board.length)) hostReveal();
}, 600);

/* ---------------------------- team ---------------------------- */

async function teamJoin(code, name){
  const snap = await get(ref(db, `${P(code)}/state`));
  if (!snap.exists()) { S.err = `No game running under ${code}. Check the code on the big screen.`; return render(); }
  S.code = code; S.teamName = name; S.err = null;
  S.teamId = "t" + Math.random().toString(36).slice(2,9);
  const me = ref(db, `${P(code)}/board/${S.teamId}`);
  await set(me, { name, score:0 });
  onDisconnect(me).cancel();
  onValue(ref(db, `${P(code)}/state`), s => {
    const prev = S.state?.qi;
    S.state = s.val();
    if (S.state && S.state.qi !== prev) { S.choice = null; S.wager = 1; }
    render();
  });
  onValue(ref(db, `${P(code)}/board`), s => {
    const v = s.val() || {};
    S.board = Object.entries(v).map(([id,t])=>({ id, name:t.name, score:t.score||0 }));
    render();
  });
}
const teamPick = (i) => {
  if (S.choice !== null) return;
  S.choice = i;
  update(ref(db, `${P(S.code)}/answers/${S.state.qi}/${S.teamId}`), { choice:i, ts:Date.now(), wager:S.wager });
  render();
};
const teamWager = (w) => {
  S.wager = w;
  update(ref(db, `${P(S.code)}/answers/${S.state.qi}/${S.teamId}`), { wager:w });
  render();
};

/* ---------------------------- render ---------------------------- */

function render(){
  if (!CONFIGURED || !db) return app.innerHTML = setupScreen();
  if (S.mode === null) return app.innerHTML = homeScreen();
  app.innerHTML = S.mode === "host" ? hostScreen() : teamScreen();
}

const setupScreen = () => `<div class="wrap narrow">
  <div class="eyebrow">Setup needed</div>
  <h1 class="big">Almost <em>there</em></h1>
  <p class="sub">Paste your Firebase config into the top of <code class="inline">index.html</code>, then reload.
  The README in this repo walks through it — about five minutes.</p>
  <ol class="setup" style="margin-top:24px">
    <li>Create a project at console.firebase.google.com</li>
    <li>Build → Realtime Database → Create Database</li>
    <li>Project settings → Your apps → Web → copy the config object</li>
    <li>Replace the <code class="inline">PASTE_ME</code> values in index.html</li>
  </ol></div>`;

const homeScreen = () => `<div class="wrap narrow" style="padding-top:30px">
  <div class="eyebrow">A pub quiz in thirty-five questions</div>
  <h1 class="big">Last <em>orders</em></h1>
  <p class="sub">Teams answer on their phones. The scoring rules change between rounds without warning — wagers,
  negative marking, bounties on whoever's winning, and one moment where first and second place swap scores.
  Runs about forty-five to fifty minutes.</p>
  <div style="margin-top:30px">
    <button class="choice" data-a="host"><div class="t">Host the quiz</div>
      <div class="d">Put this on the big screen. You control the pace.</div></button>
    <button class="choice" data-a="team"><div class="t">Join a game</div>
      <div class="d">One phone per team. You'll need the room code.</div></button>
  </div></div>`;

function hostScreen(){
  const st = S.state; if (!st) return `<div class="wrap"><p class="stat">Starting…</p></div>`;
  const qi = st.qi, q = QUESTIONS[qi];
  const head = `<div class="bar"><div><div class="eyebrow">Last Orders · Host screen</div>
    <div class="stat" style="margin-top:6px">${st.phase==="lobby" ? "Waiting for teams"
      : `Question ${qi+1} of ${QUESTIONS.length} · ${q.p} pts`}</div></div>
    <button class="ghost" data-a="quit">End game</button></div>`;

  if (st.phase === "lobby") return `<div class="wrap">${head}
    <div class="panel" style="text-align:center;padding:38px 20px">
      <div class="eyebrow">Room code</div><div class="code" style="margin-top:12px">${S.code}</div>
      <p class="sub" style="margin:18px auto 0">Teams open this same web address on one phone each,
      tap "Join a game" and enter the code.</p></div>
    <div class="teamchips">${S.board.map(t=>`<span class="teamchip">${esc(t.name)}</span>`).join("")}</div>
    <div class="foot"><button class="primary" data-a="start" ${S.board.length?"":"disabled"}>Start the quiz</button>
      <span class="stat">${S.board.length} team${S.board.length===1?"":"s"} in</span></div></div>`;

  if (st.phase === "twist") return `<div class="wrap">${head}${twistHTML(qi===0&&q.t==="none"?"none":q.t)}
    <div class="foot"><button class="primary" data-a="open">Show the question</button>
    ${(q.t==="wager"||q.t==="final")?`<span class="stat">Give them a moment to wager</span>`:""}</div></div>`;

  if (st.phase === "question"){
    const answered = Object.values(S.answers[qi]||{}).filter(a=>a.choice!=null).length;
    return `<div class="wrap">${head}
      <div class="qmeta"><span class="qnum">Question ${qi+1}</span>
        <span class="qnum">${TWISTS[q.t]?esc(TWISTS[q.t].name):"Standard scoring"} · ${q.p} pts</span></div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts two">${q.o.map((o,i)=>`<div class="opt"><span class="k">${LETTERS[i]}</span>${esc(o)}</div>`).join("")}</div>
      ${timerHTML()}
      <div class="foot"><span class="stat">${answered} of ${S.board.length} teams locked in</span>
        <button class="ghost" data-a="reveal">Reveal now</button></div></div>`;
  }

  if (st.phase === "reveal") return `<div class="wrap">${head}
    <div class="qmeta"><span class="qnum">Question ${qi+1} · answer</span>
      <span class="qnum">${(st.results||[]).filter(r=>r.ok).length} of ${S.board.length} correct</span></div>
    <h2 class="q">${esc(q.q)}</h2>
    <div class="opts two">${q.o.map((o,i)=>
      `<div class="opt ${i===q.a?"right":"wrong"}"><span class="k">${LETTERS[i]}</span>${esc(o)}</div>`).join("")}</div>
    <p class="note">${esc(q.n)}</p>
    ${q.t==="swap"?`<div class="banner" style="margin-top:16px">First and second have swapped scores. Look at the board.</div>`:""}
    <div style="margin-top:26px">${boardHTML(S.board, st.results)}</div>
    <div class="foot"><button class="primary" data-a="next">${qi+1>=QUESTIONS.length?"Final scores":"Next question"}</button></div></div>`;

  return `<div class="wrap">${head}<div class="eyebrow">That's last orders</div>
    <h1 class="big">Final <em>scores</em></h1>
    <div style="margin-top:26px">${boardHTML(S.board)}</div></div>`;
}

function teamScreen(){
  if (!S.teamId) return `<div class="wrap narrow">
    <div class="eyebrow">Last Orders</div><h1 class="big">Join a <em>game</em></h1>
    <div style="margin-top:24px"><label class="eyebrow" for="c">Room code</label>
      <input id="c" class="input" maxlength="4" placeholder="ABCD"
        style="margin-top:8px;font-family:var(--data);letter-spacing:.2em;text-transform:uppercase"></div>
    <div style="margin-top:18px"><label class="eyebrow" for="n">Team name</label>
      <input id="n" class="input" maxlength="22" placeholder="Quizteam Aguilera" style="margin-top:8px"></div>
    ${S.err?`<div class="banner" style="margin-top:16px">${esc(S.err)}</div>`:""}
    <div class="foot"><button class="primary" data-a="join">Join</button>
      <button class="ghost" data-a="quit">Back</button></div></div>`;

  const st = S.state; if (!st) return `<div class="wrap narrow"><p class="stat">Connecting…</p></div>`;
  const q = QUESTIONS[st.qi];
  const me = S.board.find(t=>t.id===S.teamId);
  const rank = [...S.board].sort((a,b)=>b.score-a.score).findIndex(t=>t.id===S.teamId)+1;
  const head = `<div class="bar"><div><div class="eyebrow">${esc(S.teamName)}</div>
    ${me?`<div class="stat" style="margin-top:6px">${me.score} pts · ${rank} of ${S.board.length}</div>`:""}</div>
    <span class="stat">${S.code}</span></div>`;

  if (st.phase === "lobby") return `<div class="wrap narrow">${head}
    <div class="panel" style="text-align:center;padding:40px 20px">
      <h1 class="big" style="font-size:clamp(30px,8vw,52px)">You're <em>in</em></h1>
      <p class="sub" style="margin:14px auto 0">Watch the big screen. It starts shortly.</p></div></div>`;

  if (st.phase === "twist"){
    const wagering = q.t==="wager" || q.t==="final";
    return `<div class="wrap narrow">${head}${twistHTML(st.qi===0&&q.t==="none"?"none":q.t)}
      ${wagering?`<div style="margin-top:20px"><div class="eyebrow">Your multiplier · locks when the question appears</div>
        <div class="chips">${[1,2,3].map(w=>`<button class="chip ${S.wager===w?"on":""}" data-a="wager" data-w="${w}">
          ×${w}<small>${w===1?"safe":w===2?"bold":"reckless"}</small></button>`).join("")}</div>
        <p class="note">Right: ${q.p*S.wager} points. Wrong: ${Math.round(q.p*0.5*S.wager)} off your score.</p></div>`:""}
      </div>`;
  }

  if (st.phase === "question") return `<div class="wrap narrow">${head}
    <div class="qmeta"><span class="qnum">Question ${st.qi+1}</span>
      <span class="qnum">${q.p*((q.t==="wager"||q.t==="final")?S.wager:1)} pts</span></div>
    <h2 class="q sm">${esc(q.q)}</h2>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${S.choice===i?"sel":""} ${S.choice!==null?"locked":""}" data-a="pick" data-i="${i}"><span class="k">${LETTERS[i]}</span>${esc(o)}</button>`).join("")}</div>
    ${timerHTML()}
    ${S.choice!==null?`<p class="note">Locked in. No changing your mind.</p>`:""}</div>`;

  if (st.phase === "reveal"){
    const r = (st.results||[]).find(x=>x.id===S.teamId);
    return `<div class="wrap narrow">${head}
      <div class="panel" style="text-align:center;padding:30px 18px;border-color:${r?.ok?"#4E9E6A":"rgba(201,165,78,.22)"}">
        <div class="eyebrow">${r?.ok?"Correct":r?"Not this time":"No answer"}</div>
        <h1 class="big" style="font-size:clamp(34px,9vw,60px)">${r?(r.delta>0?"+"+r.delta:r.delta):"0"}</h1>
        <p class="sub" style="margin:12px auto 0">Answer: ${esc(q.o[q.a])}</p></div>
      <div style="margin-top:22px">${boardHTML(S.board, st.results, S.teamId)}</div></div>`;
  }

  return `<div class="wrap narrow">${head}<div class="eyebrow">That's last orders</div>
    <h1 class="big">Final <em>scores</em></h1>
    <div style="margin-top:22px">${boardHTML(S.board, null, S.teamId)}</div></div>`;
}

/* ---------------------------- events ---------------------------- */

app.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a==="host"){ S.mode="host"; hostCreate(); }
  else if (a==="team"){ S.mode="team"; render(); }
  else if (a==="quit"){ location.reload(); }
  else if (a==="start") hostStart();
  else if (a==="open") openQuestion(S.state.qi);
  else if (a==="reveal") hostReveal();
  else if (a==="next") hostNext();
  else if (a==="pick"){ if (S.choice === null) teamPick(Number(el.dataset.i)); }
  else if (a==="wager") teamWager(Number(el.dataset.w));
  else if (a==="join"){
    const c = (document.getElementById("c").value||"").trim().toUpperCase();
    const n = (document.getElementById("n").value||"").trim();
    if (c.length!==4 || !n){ S.err="Enter a four-letter code and a team name."; return render(); }
    teamJoin(c, n);
  }
});

window.addEventListener("beforeunload", (e)=>{
  if (S.mode==="host" && S.state && S.state.phase!=="lobby" && S.state.phase!=="final"){
    e.preventDefault(); e.returnValue = "";
  }
});

render();
</script>
</body>
</html>
